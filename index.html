<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Toko Sembako</title>
  <link rel="stylesheet" href="style.css">
  <!-- Menggunakan Font Awesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="header-toko">
    <!-- Baris Atas: Info Promo / Jam Buka -->
    <div class="top-bar">
      <div class="container">
        <span><i class="fa-solid fa-truck"></i> Gratis Ongkir untuk pembelian di atas Rp100.000!</span>
        <span><i class="fa-solid fa-clock"></i> Buka Setiap Hari: 07.00 - 21.00 WIB</span>
      </div>
    </div>

    <!-- Baris Utama: Logo, Pencarian, Keranjang -->
    <div class="main-header">
      <div class="container">
        <!-- Logo -->
        <a href="#" class="logo">
          <i class="fa-solid fa-basket-shopping"></i>
          <div>
            <h1>Sembako<span>Berkah</span></h1>
            <small>Lengkap, Murah & Segar</small>
          </div>
        </a>

        <!-- Kolom Pencarian -->
        <form class="search-bar" action="#" method="GET">
          <input type="text" placeholder="Cari beras, minyak goreng, gula, telur..." required>
          <button type="submit"><i class="fa-solid fa-magnifying-glass"></i> Cari</button>
        </form>

        <!-- Aksi Pengguna (Keranjang & Akun) -->
        <div class="header-actions">
          <a href="#" class="action-item">
            <i class="fa-brands fa-whatsapp"></i>
            <span>Pesan WA</span>
          </a>
          <a href="#" class="action-item cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="badge">3</span>
            <span>Keranjang</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Baris Bawah: Navigasi Kategori -->
    <nav class="navbar">
      <div class="container">
        <ul class="nav-links">
          <li><a href="#" class="active">Beranda</a></li>
          <li><a href="#">Beras & Biji-bijian</a></li>
          <li><a href="#">Minyak & Mentega</a></li>
          <li><a href="#">Gula, Kopi & Teh</a></li>
          <li><a href="#">Telur & Susu</a></li>
          <li><a href="#">Bumbu Dapur</a></li>
          <li><a href="#" class="promo-link">Promo Hari Ini 🔥</a></li>
        </ul>
      </div>
    </nav>
  </header>

</body>
</html>
